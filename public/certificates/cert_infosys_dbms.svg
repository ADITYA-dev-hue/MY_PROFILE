<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="infoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFDFF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F8FD" />
    </linearGradient>
    <linearGradient id="infosysBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00639C" />
      <stop offset="100%" stop-color="#007CC3" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#infoBg)" />

  <!-- Borders -->
  <rect x="25" y="25" width="950" height="650" rx="4" fill="none" stroke="url(#infosysBlue)" stroke-width="4" />
  <rect x="35" y="35" width="930" height="630" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="42" y="42" width="916" height="616" fill="none" stroke="url(#goldAcc)" stroke-dasharray="8,4" stroke-width="1.5" />

  <!-- Infosys Springboard Header -->
  <g transform="translate(80, 70)">
    <text x="0" y="30" font-family="sans-serif" font-size="28" font-weight="900" fill="#007CC3" letter-spacing="-0.5">Infosys</text>
    <text x="110" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00639C" letter-spacing="1">SPRINGBOARD</text>
    <text x="110" y="36" font-family="sans-serif" font-size="9" font-style="italic" fill="#64748B">Navigate your next</text>
  </g>

  <!-- Certificate Badge -->
  <g transform="translate(820, 65)">
