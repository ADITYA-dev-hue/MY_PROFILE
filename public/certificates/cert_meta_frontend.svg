  <rect x="33" y="33" width="934" height="634" rx="6" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" />
  <rect x="42" y="42" width="916" height="616" rx="4" fill="none" stroke="#CBD5E1" stroke-dasharray="4,4" stroke-width="1" />

  <!-- Corner Decor -->
