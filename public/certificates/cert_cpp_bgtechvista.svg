<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="techBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFDFD" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBF7F7" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="bronzeBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#techBg)" />

  <!-- Borders -->
  <rect x="25" y="25" width="950" height="650" rx="6" fill="none" stroke="url(#redGrad)" stroke-width="4" />
  <rect x="35" y="35" width="930" height="630" fill="none" stroke="url(#bronzeBorder)" stroke-width="1.5" />
  <rect x="42" y="42" width="916" height="616" fill="none" stroke="#E2E8F0" stroke-dasharray="6,4" stroke-width="1.5" />

  <!-- BG TECHVISTA Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#DC2626" />
    <text x="20" y="27" font-family="sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">BG</text>
    <text x="52" y="22" font-family="sans-serif" font-size="20" font-weight="900" fill="#1E293B">TECHVISTA</text>
    <text x="52" y="36" font-family="sans-serif" font-size="9" font-weight="bold" fill="#78350F">ISO 9001:2008 &amp; ISO 27001 CERTIFIED</text>
  </g>

  <!-- CII Member Badge -->
  <g transform="translate(770, 70)">
    <rect x="0" y="0" width="150" height="38" rx="4" fill="#FEF2F2" stroke="#FCA5A5" />
    <text x="75" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991B1B" text-anchor="middle">CII MEMBER INSTITUTE</text>
  </g>

  <!-- Title -->
  <text x="500" y="175" font-family="sans-serif" font-size="15" font-weight="800" letter-spacing="4" fill="#DC2626" text-anchor="middle">
    PROFESSIONAL CERTIFICATE OF MERIT
  </text>
  <line x1="360" y1="190" x2="640" y2="190" stroke="url(#bronzeBorder)" stroke-width="2" />

  <text x="500" y="235" font-family="serif" font-size="16" font-style="italic" fill="#64748B" text-anchor="middle">
    This is to certify that
  </text>

  <!-- Recipient -->
  <text x="500" y="285" font-family="serif" font-size="40" font-weight="bold" fill="#1E293B" text-anchor="middle">
    Aditya Prakash
  </text>
  <text x="500" y="315" font-family="sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">
    S/o Sh. Satya Prakash of Bathinda Cantt, Punjab
  </text>
  <line x1="280" y1="330" x2="720" y2="330" stroke="#CBD5E1" stroke-width="1" />

  <text x="500" y="365" font-family="sans-serif" font-size="15" fill="#475569" text-anchor="middle">
    has successfully undergone and completed a 2-Month Intensive Program in
  </text>

  <!-- Course Name -->
  <text x="500" y="415" font-family="sans-serif" font-size="34" font-weight="900" fill="#991B1B" text-anchor="middle">
    Professional Course in C / C++
  </text>
  <text x="500" y="445" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">
    Training Period: 30/05/2025 to 29/07/2025 • Performance Grade: Excellent
  </text>

  <!-- Skill Badges -->
  <g transform="translate(160, 480)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#FEF2F2" stroke="#FECACA" />
    <text x="70" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">C Programming</text>

    <rect x="150" y="0" width="160" height="26" rx="13" fill="#FEF2F2" stroke="#FECACA" />
    <text x="230" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">C++ Object Oriented</text>

    <rect x="320" y="0" width="190" height="26" rx="13" fill="#FEF2F2" stroke="#FECACA" />
    <text x="415" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">Pointers &amp; Dynamic Memory</text>

    <rect x="520" y="0" width="160" height="26" rx="13" fill="#FEF2F2" stroke="#FECACA" />
    <text x="600" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">Data Structures &amp; Alg.</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(180, 550)">
    <path d="M 10 32 Q 50 15, 90 32 T 160 22" fill="none" stroke="#991B1B" stroke-width="2" />
    <line x1="0" y1="42" x2="200" y2="42" stroke="#CBD5E1" stroke-width="1" />
    <text x="100" y="58" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Technical Director</text>
    <text x="100" y="72" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Curriculum &amp; Training</text>
  </g>

  <!-- Red & Gold Seal -->
  <g transform="translate(500, 565)">
    <circle cx="0" cy="0" r="34" fill="url(#redGrad)" />
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" />
    <text x="0" y="-3" font-family="sans-serif" font-size="8" font-weight="bold" fill="#991B1B" text-anchor="middle">BG TECH</text>
    <text x="0" y="9" font-family="sans-serif" font-size="8" font-weight="bold" fill="#D97706" text-anchor="middle">VERIFIED</text>
  </g>

  <g transform="translate(630, 550)">
    <path d="M 10 28 Q 60 10, 100 30 T 170 20" fill="none" stroke="#1E293B" stroke-width="2" />
    <line x1="0" y1="42" x2="200" y2="42" stroke="#CBD5E1" stroke-width="1" />
    <text x="100" y="58" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Managing Director</text>
    <text x="100" y="72" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Authorised Signatory</text>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 645)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748B">Date of Issue: 29/07/2025</text>
    <text x="420" y="0" font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">Certificate No: BG/2025/46</text>
    <text x="840" y="0" font-family="monospace" font-size="10" fill="#DC2626" text-anchor="end">bgtechvista.com/verify</text>
  </g>
</svg>
