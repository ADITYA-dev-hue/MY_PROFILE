    <circle cx="40" cy="40" r="26" fill="#FFFFFF" />
    <text x="40" y="37" font-family="sans-serif" font-size="8" font-weight="bold" fill="#007CC3" text-anchor="middle">COURSE</text>
    <text x="40" y="48" font-family="sans-serif" font-size="7" font-weight="bold" fill="#C59B27" text-anchor="middle">COMPLETION</text>
  </g>

  <text x="500" y="180" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#007CC3" text-anchor="middle">
    CERTIFICATE OF COMPLETION
  </text>
  <line x1="380" y1="195" x2="620" y2="195" stroke="url(#goldAcc)" stroke-width="2" />

  <text x="500" y="240" font-family="serif" font-size="16" font-style="italic" fill="#64748B" text-anchor="middle">
    Congratulations! You have successfully completed
  </text>

