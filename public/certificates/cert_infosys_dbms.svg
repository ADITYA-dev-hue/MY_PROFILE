  <text x="500" y="295" font-family="sans-serif" font-size="34" font-weight="800" fill="#0F172A" text-anchor="middle">
    Database Management System Part - 1
  </text>
  <text x="500" y="325" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">
    Relational Data Modeling • SQL Optimization • Data Integrity
  </text>

  <text x="500" y="375" font-family="serif" font-size="16" font-style="italic" fill="#64748B" text-anchor="middle">
    Awarded to
  </text>

