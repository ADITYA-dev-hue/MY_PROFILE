  <!-- Footer -->
  <g transform="translate(80, 650)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748B">Completed: July 14, 2026 | Issued: July 15, 2026</text>
    <text x="840" y="0" font-family="monospace" font-size="10" fill="#007CC3" text-anchor="end">springboard.infosys.com</text>
  </g>
