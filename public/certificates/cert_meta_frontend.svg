    <text x="420" y="0" font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">Credential ID: 9MMUP2UFGZEX</text>
    <text x="840" y="0" font-family="monospace" font-size="10" fill="#0064E0" text-anchor="end">coursera.org/verify/9MMUP2UFGZEX</text>
