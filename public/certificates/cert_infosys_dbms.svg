  <text x="500" y="430" font-family="serif" font-size="44" font-weight="bold" fill="#007CC3" text-anchor="middle">
    Aditya Prakash
  </text>
  <line x1="280" y1="445" x2="720" y2="445" stroke="#CBD5E1" stroke-width="1" />

  <!-- Skills -->
  <g transform="translate(180, 480)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#E0F2FE" stroke="#BAE6FD" />
    <text x="75" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">RDBMS Architecture</text>

    <rect x="160" y="0" width="160" height="26" rx="13" fill="#E0F2FE" stroke="#BAE6FD" />
    <text x="240" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">SQL Queries &amp; Joins</text>

    <rect x="330" y="0" width="160" height="26" rx="13" fill="#E0F2FE" stroke="#BAE6FD" />
    <text x="410" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Relational Modeling</text>

    <rect x="500" y="0" width="150" height="26" rx="13" fill="#E0F2FE" stroke="#BAE6FD" />
    <text x="575" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Database Normalization</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(160, 550)">
    <path d="M 10 32 Q 50 12, 100 28 T 170 20" fill="none" stroke="#007CC3" stroke-width="2" />
    <line x1="0" y1="42" x2="220" y2="42" stroke="#94A3B8" stroke-width="1" />
    <text x="110" y="58" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Satheesha B. Nanjappa</text>
    <text x="110" y="72" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Senior Vice President &amp; Head ETA</text>
    <text x="110" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Infosys Limited</text>
  </g>

  <!-- Seal -->
  <g transform="translate(500, 565)">
    <circle cx="0" cy="0" r="32" fill="#007CC3" />
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" />
    <text x="0" y="4" font-family="sans-serif" font-size="9" font-weight="900" fill="#007CC3" text-anchor="middle">INFOSYS</text>
  </g>

  <g transform="translate(640, 550)">
    <path d="M 10 30 Q 60 15, 110 35 T 180 22" fill="none" stroke="#1E293B" stroke-width="2" />
    <line x1="0" y1="42" x2="220" y2="42" stroke="#94A3B8" stroke-width="1" />
    <text x="110" y="58" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Infosys Springboard</text>
    <text x="110" y="72" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Digital Academy</text>
